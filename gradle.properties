org.gradle.jvmargs=-Xmx2g
android.useAndroidX=true
kotlin.code.style=official

# CI resilience: dl.google.com occasionally stalls ("Read timed out") while resolving the Android Gradle Plugin.
# Longer timeouts + more retries with backoff let Gradle ride out transient network hiccups.
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.repository.max.retries=6
systemProp.org.gradle.internal.repository.initial.backoff=1000
