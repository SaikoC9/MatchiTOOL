<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MatchiTOOL</title>
<style>
  :root{--bg:#0f1115;--card:#1a1d24;--fg:#e6e8ee;--mut:#8b92a3;--acc:#6ea8ff;--bd:#2a2f3a}
  @media (prefers-color-scheme: light){:root{--bg:#f4f6fa;--card:#fff;--fg:#1a1d24;--mut:#667;--acc:#2563eb;--bd:#d8dce6}}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif}
  header{padding:14px 18px;border-bottom:1px solid var(--bd);font-weight:600;font-size:18px}
  main{max-width:760px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
  .actions-buttons{display:flex;flex-wrap:wrap;gap:8px}
  button{background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:9px 14px;font:inherit;cursor:pointer}
  button:hover{border-color:var(--acc)}
  input{background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:9px;font:inherit;width:100%}
  .mut{color:var(--mut)}
  .row{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--bd)}
  .row .n{flex:1;word-break:break-all}
  pre#out{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:10px;max-height:300px;overflow:auto;white-space:pre-wrap;margin:10px 0 0}
  .tabs{display:flex;gap:8px;margin-bottom:12px}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:1000;padding:12px}
  .modal-bg.show{display:flex}
  .modal{background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:14px;width:100%;overflow:auto;max-height:92vh;padding:14px}
  .modal h3{margin:0 0 10px}
  #toasts{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:2000;display:flex;flex-direction:column;gap:8px;width:min(92vw,560px)}
  .toast{padding:10px 14px;border-radius:10px;color:#fff;background:#2b8a3e;box-shadow:0 4px 14px rgba(0,0,0,.35)}
</style></head>
<body>
<header>MatchiTOOL</header>
<main>
  <div class="card" id="login" style="display:none">
    <p>Enter the access token shown in the MatchiTOOL app.</p>
    <input id="tok" type="password" placeholder="Access token" autocomplete="off">
    <p><button id="tokbtn">Connect</button> <span id="tokerr" class="mut"></span></p>
  </div>
  <div class="card" id="home" style="display:none">
    <div class="mut" style="margin-bottom:8px">Plugins</div>
    <div class="actions-buttons"></div>
  </div>
  <div class="card" id="terminal" style="display:none">
    <div class="mut" style="margin-bottom:8px">Root terminal</div>
    <input id="cmd" placeholder="Command, press Enter to run" autocomplete="off" autocapitalize="off" spellcheck="false">
    <pre id="out" style="display:none"></pre>
  </div>
  <div class="card" id="pluginmgr" style="display:none">
    <div class="mut" style="margin-bottom:8px">Manage plugins <span>(changes apply after reload)</span></div>
    <div id="pluglist"></div>
    <p><input id="plugfile" type="file" accept=".js"></p>
  </div>
</main>
<div id="toasts"></div>
<script>
const COLORS={red:'#c92a2a',orange:'#e8590c',green:'#2b8a3e',blue:'#1c7ed6'};
function createToast(msg,color,ms){
  const t=document.createElement('div');t.className='toast';t.textContent=msg;
  t.style.background=COLORS[color]||color||COLORS.green;
  document.getElementById('toasts').appendChild(t);setTimeout(()=>t.remove(),ms||3000);
}
let TOKEN=localStorage.getItem('matchi_token')||'';
async function api(path,opt={}){
  const r=await fetch(path,{...opt,headers:{'x-token':TOKEN,'content-type':'application/json'}});
  if(r.status===401)throw new Error('unauthorized');
  if(r.status===429)throw new Error('too many attempts, wait a minute');
  return r.json();
}
/* Host API expected by UFI-TOOLS plugins */
async function runShellWithRoot(cmd,timeout=20000){
  return api('/api/shell',{method:'POST',body:JSON.stringify({cmd,timeout})});
}
function createModal({name,title,maxWidth='600px',contentStyle='',showConfirm=true,onClose,content}){
  document.getElementById(name)?.remove();
  const bg=document.createElement('div');bg.className='modal-bg';bg.id=name;
  bg.innerHTML=`<div class="modal" style="max-width:${maxWidth};${contentStyle}"><h3></h3><div class="mbody"></div><div style="text-align:right;margin-top:10px"><button class="mclose">Close</button></div></div>`;
  bg.querySelector('h3').textContent=title||'';
  bg.querySelector('.mbody').innerHTML=content||'';
  bg.querySelector('.mclose').onclick=()=>closeModal(name,onClose);
  document.body.appendChild(bg);
  bg._onClose=onClose;
  return {id:name,el:bg};
}
function showModal(id){document.getElementById(id)?.classList.add('show')}
function closeModal(id,cb){
  const el=document.getElementById(id);if(!el)return;
  const f=cb||el._onClose;if(f&&f()===false)return;
  el.classList.remove('show');
}
async function loadPlugins(){
  const list=await api('/api/plugins');
  renderPlugins(list);
  for(const p of list){
    if(!p.enabled)continue;
    const s=document.createElement('script');s.textContent=p.code;s.dataset.plugin=p.name;
    document.head.appendChild(s);
  }
}
function renderPlugins(list){
  const box=document.getElementById('pluglist');box.textContent='';
  for(const p of list){
    const row=document.createElement('div');row.className='row';
    const n=document.createElement('span');n.className='n';n.textContent=p.name;
    const t=document.createElement('button');t.textContent=p.enabled?'Disable':'Enable';
    t.onclick=async()=>{await api('/api/plugins/toggle',{method:'POST',body:JSON.stringify({name:p.name,enabled:!p.enabled})});location.reload()};
    const d=document.createElement('button');d.textContent='Delete';
    d.onclick=async()=>{if(!confirm('Delete '+p.name+'?'))return;await api('/api/plugins/delete',{method:'POST',body:JSON.stringify({name:p.name})});location.reload()};
    row.append(n,t,d);box.appendChild(row);
  }
}
document.getElementById('plugfile').onchange=async(e)=>{
  const f=e.target.files[0];if(!f)return;
  const r=await api('/api/plugins',{method:'POST',body:JSON.stringify({name:f.name,code:await f.text()})});
  if(r.ok){createToast('Uploaded '+f.name);setTimeout(()=>location.reload(),600)}else createToast(r.error||'Upload failed','red');
};
document.getElementById('cmd').onkeydown=async(e)=>{
  if(e.key!=='Enter')return;
  const c=e.target.value.trim();if(!c)return;
  const out=document.getElementById('out');out.style.display='block';out.textContent='$ '+c+'\n...';
  try{const r=await runShellWithRoot(c,60000);out.textContent='$ '+c+'\n'+(r.content||'')+(r.success?'':'\n[failed]')}
  catch(err){out.textContent='Error: '+err.message}
};
async function start(){
  document.getElementById('login').style.display='none';
  try{await api('/api/ping')}catch(e){
    document.getElementById('login').style.display='block';return;
  }
  for(const id of ['home','terminal','pluginmgr'])document.getElementById(id).style.display='block';
  await loadPlugins();
}
document.getElementById('tokbtn').onclick=async()=>{
  TOKEN=document.getElementById('tok').value.trim();
  try{await api('/api/ping');localStorage.setItem('matchi_token',TOKEN);start()}
  catch(e){document.getElementById('tokerr').textContent='Wrong token'}
};
start();
</script>
</body></html>
