# Weekly pull requests for newer versions of the GitHub Actions (pinned to a commit, see scripts/pin-actions.sh) and of the Gradle
# dependencies. Review each one; a version bump never merges itself, and every pull request must pass the build first.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions:            # one pull request for all action updates instead of one each
        patterns: ["*"]
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      # The Android Gradle Plugin and Kotlin move together with the Gradle version (8.7) and the build scripts: upgrade them by hand, on purpose.
      - dependency-name: "com.android.application"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "org.jetbrains.kotlin.android"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Gradle 9 does not work with the Android Gradle Plugin 8.5.2 used here; CI pins Gradle 8.7. Move the wrapper by hand, together with the plugin.
      - dependency-name: "gradle-wrapper"
        update-types: ["version-update:semver-major"]
