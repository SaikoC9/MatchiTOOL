name: Build jq and curl (arm64 Android)

on:
  workflow_dispatch:
    inputs:
      jq_tag:
        description: jqlang/jq tag
        default: jq-1.8.2
      curl_tag:
        description: curl/curl tag
        default: curl-8_23_0
      openssl_tag:
        description: openssl/openssl tag (statically linked into curl)
        default: openssl-3.5.9
  # Called by release-tools.yml. Keep these defaults the same as the three above.
  workflow_call:
    inputs:
      jq_tag:
        type: string
        default: jq-1.8.2
      curl_tag:
        type: string
        default: curl-8_23_0
      openssl_tag:
        type: string
        default: openssl-3.5.9
      artifact_name:
        type: string
        default: matchitool-binaries-arm64

permissions:
  contents: read

env:
  API: "26"            # same minSdk as the app (Android 8.0)
  TRIPLE: aarch64-linux-android

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool make perl file

      - name: NDK toolchain
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          [ -d "$NDK" ] || { echo "no NDK on this runner"; exit 1; }
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          echo "TC=$TC" >> "$GITHUB_ENV"
          echo "$TC/bin" >> "$GITHUB_PATH"
          echo "CC=$TC/bin/${TRIPLE}${API}-clang" >> "$GITHUB_ENV"
          echo "AR=$TC/bin/llvm-ar" >> "$GITHUB_ENV"
          echo "RANLIB=$TC/bin/llvm-ranlib" >> "$GITHUB_ENV"
          echo "STRIP=$TC/bin/llvm-strip" >> "$GITHUB_ENV"
          echo "NDK=$NDK" >> "$GITHUB_ENV"

      # ---------- jq (static) ----------
      - name: Get jq source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jqlang/jq
          ref: ${{ inputs.jq_tag }}
          submodules: recursive
          path: jq-src
      - name: Build jq
        run: |
          cd jq-src
          autoreconf -fi
          ./configure --host=$TRIPLE --disable-docs --disable-maintainer-mode \
            --with-oniguruma=builtin --enable-static --enable-all-static --disable-shared \
            LDFLAGS="-static"
          make -j"$(nproc)" LDFLAGS="-all-static"
          $STRIP -o ../jq jq
          cd ..; file jq

      # ---------- OpenSSL (static, only used to link curl) ----------
      - name: Get OpenSSL source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openssl/openssl
          ref: ${{ inputs.openssl_tag }}
          path: openssl-src
      - name: Build OpenSSL
        run: |
          cd openssl-src
          # OpenSSL's android target looks up "<triple>-<CC>" on PATH and wants a bare
          # compiler name; NDK r23+ is clang-only, so CC must be "clang" (not a full path).
          export ANDROID_NDK_ROOT="$NDK"
          export PATH="$TC/bin:$PATH"
          # Reproducible build: OpenSSL writes "built on: <date>" into the library. SOURCE_DATE_EPOCH (the tag's commit time)
          # makes that date the same on every run, so the same tags give the same curl.
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH"
          CC=clang AR=llvm-ar RANLIB=llvm-ranlib \
          ./Configure android-arm64 -D__ANDROID_API__=$API no-shared no-tests \
            --prefix="$PWD/../ossl" --openssldir=/system/etc/security
          make -j"$(nproc)" build_libs
          make install_dev

      # ---------- curl ----------
      - name: Get curl source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: curl/curl
          ref: ${{ inputs.curl_tag }}
          path: curl-src
      - name: Build curl
        run: |
          cd curl-src
          # Reproducible build: fixed dates, no build path or build id in the binary (see the OpenSSL step).
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export TZ=UTC LC_ALL=C
          export CFLAGS="-ffile-prefix-map=$GITHUB_WORKSPACE=. -g0"
          export LDFLAGS="-Wl,--build-id=none"
          autoreconf -fi
          ./configure --host=$TRIPLE --disable-shared --enable-static \
            --with-openssl="$PWD/../ossl" --with-ca-path=/system/etc/security/cacerts \
            --without-libpsl --without-brotli --without-zstd --without-nghttp2 --without-libidn2 \
            --disable-ldap --disable-ldaps --disable-manual --disable-docs
          make -j"$(nproc)" curl_LDFLAGS="-all-static" || make -j"$(nproc)"
          $STRIP -o ../curl src/curl
          cd ..; file curl

      - name: Check and record
        run: |
          mkdir out; cp jq curl out/
          for f in jq curl; do
            file "out/$f" | grep -q "ARM aarch64" || { echo "$f is not arm64"; exit 1; }
          done
          echo "== dynamic libraries needed (curl may only need bionic: libc, libm, libdl) =="
          "$TC/bin/llvm-readelf" -d out/curl | grep NEEDED || true
          "$TC/bin/llvm-readelf" -d out/jq   | grep NEEDED || echo "jq: static"
          {
            echo "## Built binaries"
            echo "| file | source | SHA-256 |"
            echo "|---|---|---|"
            echo "| jq | jqlang/jq @ ${{ inputs.jq_tag }} | \`$(sha256sum out/jq | cut -d' ' -f1)\` |"
            echo "| curl | curl/curl @ ${{ inputs.curl_tag }} + OpenSSL @ ${{ inputs.openssl_tag }} | \`$(sha256sum out/curl | cut -d' ' -f1)\` |"
            echo
            echo "NDK: $(basename "$NDK"), API $API"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          sha256sum out/* > out/SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ inputs.artifact_name || 'matchitool-binaries-arm64' }}
          path: out/*
