name: Build matchi-doctor (arm64 Android)

# Builds tools/doctor (stdlib-only Go, our own source) into a static arm64 executable. Run it by hand (release-tools.yml does not call it yet).
# By hand: download the artifact, test on the device (tools/doctor/README.md), copy it to app/src/main/assets/bin/matchi-doctor, then
# write the printed SHA-256 into NOTICE.md and docs/BINARIES.md (scripts/validate.sh checks it).
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      artifact_name:
        type: string
        default: matchitool-doctor-arm64

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.10"
      - name: Test
        working-directory: tools/doctor
        run: go vet ./... && go test ./...
      - name: Build
        working-directory: tools/doctor
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm64
        run: |
          go build -trimpath -ldflags "-s -w" -o ../../matchi-doctor .
          cd ../..; file matchi-doctor | grep -q "ARM aarch64" || { echo "not arm64"; exit 1; }
          sha256sum matchi-doctor | tee SHA256SUMS
          { echo "## matchi-doctor"; echo "\`$(sha256sum matchi-doctor | cut -d' ' -f1)\`"; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name || 'matchitool-doctor-arm64' }}
          path: |
            matchi-doctor
            SHA256SUMS
