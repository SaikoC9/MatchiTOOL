name: Build matchi-sampler (arm64 Android)

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      artifact_name:
        type: string
        default: matchitool-sampler-arm64

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.26.10"
      - name: Test
        working-directory: tools/sampler
        run: go vet ./... && go test ./...
      - name: Build
        working-directory: tools/sampler
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm64
        run: |
          go build -trimpath -ldflags "-s -w" -o ../../matchi-sampler .
          cd ../..; file matchi-sampler | grep -q "ARM aarch64" || { echo "not arm64"; exit 1; }
          sha256sum matchi-sampler | tee SHA256SUMS
          { echo "## matchi-sampler"; echo "\`$(sha256sum matchi-sampler | cut -d' ' -f1)\`"; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ inputs.artifact_name || 'matchitool-sampler-arm64' }}
          path: |
            matchi-sampler
            SHA256SUMS
