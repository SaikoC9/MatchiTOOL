name: Build sendat (arm64 Android)

# Builds tools/sendat (stdlib-only Go) into a static arm64 executable. Run it by hand, or let release-tools.yml call it.
# By hand: download the artifact, test on the device, copy it to app/src/main/assets/bin/sendat, then write the
# printed SHA-256 into NOTICE.md and docs/BINARIES.md (scripts/validate.sh checks it).
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      artifact_name:
        type: string
        default: matchitool-sendat-arm64

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.10"
      - name: Test
        working-directory: tools/sendat
        run: go vet ./... && go test ./...
      - name: Build
        working-directory: tools/sendat
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm64
        run: |
          go build -trimpath -ldflags "-s -w" -o ../../sendat .
          cd ../..; file sendat | grep -q "ARM aarch64" || { echo "not arm64"; exit 1; }
          sha256sum sendat | tee SHA256SUMS
          { echo "## sendat"; echo "\`$(sha256sum sendat | cut -d' ' -f1)\`"; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ inputs.artifact_name || 'matchitool-sendat-arm64' }}
          path: |
            sendat
            SHA256SUMS
