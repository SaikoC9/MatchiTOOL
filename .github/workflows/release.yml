name: Publish APK to public releases repo
# Source stays private. Only the signed APK is published, to a separate PUBLIC repo, so the device can download it (OTA).
# Run manually: Actions > "Publish APK to public releases repo" > Run workflow.
on:
  workflow_dispatch:
# Two publishes at once could race on the same release tag: the second waits, it is never cancelled.
concurrency:
  group: publish-release
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          gradle-version: '8.7'
      - name: Validate source
        run: bash scripts/validate.sh
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.MATCHI_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::MATCHI_KEYSTORE_B64 secret is missing; refusing to publish an APK with a random key"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/matchitool-release.jks"
          echo "MATCHI_KEYSTORE_FILE=$RUNNER_TEMP/matchitool-release.jks" >> "$GITHUB_ENV"
      - name: Unit tests
        run: |
          bash scripts/gradle-retry.sh :app:testDebugUnitTest --stacktrace
      - name: Build signed RELEASE APK
        env:
          MATCHI_KEYSTORE_PASSWORD: ${{ secrets.MATCHI_KEYSTORE_PASSWORD }}
          MATCHI_KEY_ALIAS: matchitool
          MATCHI_KEY_PASSWORD: ${{ secrets.MATCHI_KEYSTORE_PASSWORD }}
        run: |
          bash scripts/gradle-retry.sh :app:assembleRelease --stacktrace
      - name: Refuse to publish a debuggable or unsigned APK
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          [ -f "$APK" ] || { echo "::error::$APK was not produced (unsigned release builds are named app-release-unsigned.apk)"; exit 1; }
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          if "$BT/aapt2" dump badging "$APK" | grep -q "application-debuggable"; then
            echo "::error::the release APK is debuggable; refusing to publish"; exit 1
          fi
          "$BT/apksigner" verify --print-certs "$APK"
      - name: Smoke-test the shrunk release APK (components, NanoHTTPD, assets survived R8)
        run: bash scripts/check_release_apk.sh app/build/outputs/apk/release/app-release.apk
      # R8 renames classes/methods in the release build (proguard-rules.pro). Kept as a PRIVATE artifact of this workflow
      # run ONLY - the next step publishes just the APK to the public releases repo, so this mapping never goes there.
      - name: Upload mapping.txt as a private build artifact (needed to de-obfuscate a trace pulled off a device)
        run: cp app/build/outputs/mapping/release/mapping.txt "mapping-$(grep -oP '^VERSION_CODE=\K.+' version.properties).txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: MatchiTOOL-mapping
          path: mapping-*.txt
          if-no-files-found: error
      - name: Publish to the public releases repo
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          RELEASES_REPO: ${{ vars.RELEASES_REPO }}
        run: |
          if [ -z "$RELEASES_REPO" ] || [ -z "$GH_TOKEN" ]; then echo "::error::Set repo variable RELEASES_REPO (owner/name) and secret RELEASES_TOKEN"; exit 1; fi
          VER=$(grep -oP '^VERSION_NAME=\K.+' version.properties)
          cp app/build/outputs/apk/release/app-release.apk MatchiTOOL.apk
          SHA=$(sha256sum MatchiTOOL.apk | cut -d' ' -f1)
          echo "Version $VER" ; echo "SHA-256 $SHA"
          NOTES="MatchiTOOL $VER
          SHA-256: $SHA"
          if gh release view "v$VER" --repo "$RELEASES_REPO" >/dev/null 2>&1; then
            gh release upload "v$VER" MatchiTOOL.apk --clobber --repo "$RELEASES_REPO"
            gh release edit "v$VER" --notes "$NOTES" --latest --repo "$RELEASES_REPO"
          else
            gh release create "v$VER" MatchiTOOL.apk --title "MatchiTOOL $VER" --notes "$NOTES" --latest --repo "$RELEASES_REPO"
          fi
          echo "OTA link: https://github.com/$RELEASES_REPO/releases/latest/download/MatchiTOOL.apk"
