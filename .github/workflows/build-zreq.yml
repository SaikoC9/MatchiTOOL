name: Build zreq (arm64 Android)

# Builds tools/zreq (stdlib-only Go, our own source) into a static arm64 executable. Manual only, like build-sendat.yml:
# run it, download the artifact, test on the device (tools/zreq/README.md), copy it to app/src/main/assets/bin/zreq, then
# write the printed SHA-256 into NOTICE.md and docs/BINARIES.md (scripts/validate.sh checks it).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.22.8"
      - name: Test
        working-directory: tools/zreq
        run: go vet ./... && go test ./...
      - name: Build
        working-directory: tools/zreq
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm64
        run: |
          go build -trimpath -ldflags "-s -w" -o ../../zreq .
          cd ../..; file zreq | grep -q "ARM aarch64" || { echo "not arm64"; exit 1; }
          sha256sum zreq | tee SHA256SUMS
          { echo "## zreq"; echo "\`$(sha256sum zreq | cut -d' ' -f1)\`"; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: matchitool-zreq-arm64
          path: |
            zreq
            SHA256SUMS
