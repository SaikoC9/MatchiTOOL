name: Build zreq (arm64 Android)

# Builds tools/zreq (stdlib-only Go, our own source) into a static arm64 executable. Run it by hand, or let release-tools.yml call it.
# By hand: download the artifact, test on the device (tools/zreq/README.md), copy it to app/src/main/assets/bin/zreq, then
# write the printed SHA-256 into NOTICE.md and docs/BINARIES.md (scripts/validate.sh checks it).
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      artifact_name:
        type: string
        default: matchitool-zreq-arm64

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.26.10"
      - name: Test
        working-directory: tools/zreq
        run: go vet ./... && go test ./...
      - name: Build
        working-directory: tools/zreq
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm64
        run: |
          go build -trimpath -ldflags "-s -w" -o ../../zreq .
          cd ../..; file zreq | grep -q "ARM aarch64" || { echo "not arm64"; exit 1; }
          sha256sum zreq | tee SHA256SUMS
          { echo "## zreq"; echo "\`$(sha256sum zreq | cut -d' ' -f1)\`"; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ inputs.artifact_name || 'matchitool-zreq-arm64' }}
          path: |
            zreq
            SHA256SUMS
