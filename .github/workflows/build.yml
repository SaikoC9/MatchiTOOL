name: Validate and build APK
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'
      - name: Validate source and plugin JavaScript
        run: bash scripts/validate.sh
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.MATCHI_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/matchitool-release.jks"
            echo "MATCHI_KEYSTORE_FILE=$RUNNER_TEMP/matchitool-release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::MATCHI_KEYSTORE_B64 secret missing: APK gets a random debug key and cannot update an installed MatchiTOOL"
          fi
      - name: Unit tests
        run: |
          G=gradle; [ -x ./gradlew ] && G=./gradlew
          for i in 1 2 3; do
            $G :app:testDebugUnitTest --stacktrace && break
            [ "$i" = 3 ] && exit 1
            echo "::warning::Gradle failed (attempt $i/3), retrying in 20s (likely a network timeout)"; sleep 20
          done
      - name: Build debug and release APKs (signed with the permanent key)
        env:
          MATCHI_KEYSTORE_PASSWORD: ${{ secrets.MATCHI_KEYSTORE_PASSWORD }}
          MATCHI_KEY_ALIAS: matchitool
          MATCHI_KEY_PASSWORD: ${{ secrets.MATCHI_KEYSTORE_PASSWORD }}
        run: |
          G=gradle; [ -x ./gradlew ] && G=./gradlew
          for i in 1 2 3; do
            $G :app:assembleDebug :app:assembleRelease --stacktrace && break
            [ "$i" = 3 ] && exit 1
            echo "::warning::Gradle failed (attempt $i/3), retrying in 20s (likely a network timeout)"; sleep 20
          done
      - uses: actions/upload-artifact@v7
        with:
          name: MatchiTOOL
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/*.apk
      # publish-release.yml downloads exactly this name from this run; it must hold only the signed release APK.
      - uses: actions/upload-artifact@v7
        with:
          name: MatchiTOOL-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
