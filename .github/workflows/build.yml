name: Validate and build APK
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.7'
      - name: Validate source and plugin JavaScript
        run: bash scripts/validate.sh
      - name: Restore the permanent signing key (build fails without it)
        env:
          KEYSTORE_B64: ${{ secrets.MATCHI_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MATCHI_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Secrets MATCHI_KEYSTORE_B64 and MATCHI_KEYSTORE_PASSWORD must be set. Without them every build gets a random key and can never update an installed MatchiTOOL."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/matchitool-release.jks"
          echo "MATCHI_KEYSTORE_FILE=$RUNNER_TEMP/matchitool-release.jks" >> "$GITHUB_ENV"
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Build signed release APK
        env:
          MATCHI_KEYSTORE_PASSWORD: ${{ secrets.MATCHI_KEYSTORE_PASSWORD }}
          MATCHI_KEY_ALIAS: matchitool
          MATCHI_KEY_PASSWORD: ${{ secrets.MATCHI_KEYSTORE_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace
      - name: Check the APK (signed with the permanent key, not debuggable)
        env:
          EXPECTED_CERT_SHA256: ${{ vars.MATCHI_CERT_SHA256 }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          [ -f "$APK" ] || { echo "::error::$APK was not produced"; ls app/build/outputs/apk/release; exit 1; }
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          if "$BT/aapt2" dump badging "$APK" | grep -q "application-debuggable"; then
            echo "::error::the APK is debuggable; refusing"; exit 1
          fi
          CERTS=$("$BT/apksigner" verify --print-certs "$APK")
          echo "$CERTS"
          CERT=$(echo "$CERTS" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)
          echo "Signing certificate SHA-256: $CERT"
          # Optional guard: set repo variable MATCHI_CERT_SHA256 to this value once, and any build signed by another key fails.
          if [ -n "$EXPECTED_CERT_SHA256" ] && [ "$CERT" != "$(echo "$EXPECTED_CERT_SHA256" | tr 'A-F' 'a-f' | tr -d ': ')" ]; then
            echo "::error::signed with a different key than MATCHI_CERT_SHA256; refusing"; exit 1
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: MatchiTOOL-release
          path: app/build/outputs/apk/release/app-release.apk
