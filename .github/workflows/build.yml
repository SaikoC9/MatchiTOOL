name: Validate and build APK
on: [push, pull_request, workflow_dispatch]
# A newer push to the same branch / pull request replaces a build that is still running.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          gradle-version: '8.7'
      - name: Validate source and plugin JavaScript
        run: bash scripts/validate.sh
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.MATCHI_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/matchitool-release.jks"
            echo "MATCHI_KEYSTORE_FILE=$RUNNER_TEMP/matchitool-release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::MATCHI_KEYSTORE_B64 secret missing: APK gets a random debug key and cannot update an installed MatchiTOOL"
          fi
      - name: Unit tests
        run: |
          bash scripts/gradle-retry.sh :app:testDebugUnitTest --stacktrace
      - name: Build debug and release APKs (signed with the permanent key)
        env:
          MATCHI_KEYSTORE_PASSWORD: ${{ secrets.MATCHI_KEYSTORE_PASSWORD }}
          MATCHI_KEY_ALIAS: matchitool
          MATCHI_KEY_PASSWORD: ${{ secrets.MATCHI_KEYSTORE_PASSWORD }}
        run: |
          bash scripts/gradle-retry.sh :app:assembleDebug :app:assembleRelease --stacktrace
      - name: Smoke-test the shrunk release APK (components, NanoHTTPD, assets survived R8)
        run: bash scripts/check_release_apk.sh app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: MatchiTOOL
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/*.apk
      # publish-release.yml downloads exactly this name from this run; it must hold only the signed release APK.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: MatchiTOOL-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      # R8 renames classes/methods in the release build (proguard-rules.pro); this mapping is the only way to turn a renamed
      # class/method back into the real one in a trace pulled off a device. Kept as a PRIVATE build artifact only - neither
      # release workflow downloads it, so it never reaches the public releases repo. Download it from this run and keep it
      # next to the version it was built for (the file name below has versionCode in it for that reason).
      - name: Rename mapping.txt with this build's versionCode
        run: cp app/build/outputs/mapping/release/mapping.txt "mapping-$(grep -oP '^VERSION_CODE=\K.+' version.properties).txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: MatchiTOOL-mapping
          path: mapping-*.txt
          if-no-files-found: error
