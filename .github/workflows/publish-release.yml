name: Publish CI build to public releases repo

on:
  workflow_run:
    workflows:
      - Validate and build APK
    types:
      - completed
    branches:
      - main

permissions:
  actions: read
  contents: read

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v8
        with:
          name: MatchiTOOL-release
          path: ./artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare APK
        id: apk
        run: |
          mkdir -p release
          APK=$(find ./artifact -type f -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "APK not found!"
            exit 1
          fi
          cp "$APK" release/MatchiTOOL.apk
          SHA=$(sha256sum release/MatchiTOOL.apk | cut -d ' ' -f 1)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - name: Refuse to publish a debuggable or debug-signed APK
        run: |
          APK=release/MatchiTOOL.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          if "$BT/aapt2" dump badging "$APK" | grep -q "application-debuggable"; then
            echo "::error::the release APK is debuggable; refusing to publish"; exit 1
          fi
          CERTS=$("$BT/apksigner" verify --print-certs "$APK") || { echo "::error::APK signature does not verify; refusing to publish"; exit 1; }
          echo "$CERTS"
          if echo "$CERTS" | grep -qi "CN=Android Debug"; then
            echo "::error::APK is signed with the Android debug key (MATCHI_KEYSTORE_B64 missing in the build?); refusing to publish"; exit 1
          fi
      - name: Publish to public repository
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          RELEASES_REPO: ${{ vars.RELEASES_REPO }}
          SHA: ${{ steps.apk.outputs.sha }}
        run: |
          TAG="build-${{ github.event.workflow_run.run_number }}"
          gh release create "$TAG" \
            release/MatchiTOOL.apk#MatchiTOOL.apk \
            --latest=false \
            --repo "$RELEASES_REPO" \
            --title "MatchiTOOL $TAG" \
            --notes "Signed release APK build.
          SHA-256: $SHA"
